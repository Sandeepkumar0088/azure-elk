input {
  beats {
    port => 5044
  }
}

filter {
  if [kubernetes][container][name] == "controller" {
      grok {
        match => { "message" => "%{IPORHOST:client_ip} %{DATA:ident} %{DATA:auth} \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request_uri} HTTP/%{NUMBER:http_version}\" %{INT:status_code:int} %{INT:bytes_sent:int} \"%{DATA:referrer}\" \"%{DATA:user_agent}\" %{INT:request_length} %{NUMBER:request_time} \[%{DATA:frontend_name}\] \[%{DATA:upstream_info}\] %{IPORHOST:upstream_ip}:%{INT:upstream_port} %{INT:upstream_response_length} %{NUMBER:upstream_response_time:float} %{INT:upstream_status:int} %{NOTSPACE:request_id}" }
      }
  }

  if [kubernetes][container][name] == "shipping" {
      grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:log_level}\s+%{INT:pid}\s+---\s+\[%{DATA:thread}\]\s+%{DATA:logger}\s+:\s+%{GREEDYDATA:log_message}" }
      }
    }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "%{[kubernetes][container][name]}-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "=Hx4wn9mN7a+V8oG7b+9"
    ssl_verification_mode => "none"
  }
}

